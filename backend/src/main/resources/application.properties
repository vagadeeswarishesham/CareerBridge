# Application Properties
spring.application.name=career-bridge-backend
server.port=8080

# Active Profile fallback: defaults to h2 if MySQL is unavailable, or active profile spring.profiles.active
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Default MySQL configuration (used when SPRING_PROFILES_ACTIVE=mysql)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/career_bridge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Settings
app.jwt.secret=${JWT_SECRET:CareerBridgeSuperSecretKeyForJWTAuthentication2026Secure123!}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
