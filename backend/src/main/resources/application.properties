# Application Properties
spring.application.name=career-bridge-backend
server.port=${PORT:8080}

# Local default profile; set SPRING_PROFILES_ACTIVE=postgres in .env for PostgreSQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT settings. Set JWT_SECRET in .env locally and in Render Environment.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
