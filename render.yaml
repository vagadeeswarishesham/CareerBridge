services:
  - type: web
    name: careerbridge-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/jobs
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://careerbridge-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173

  - type: web
    name: careerbridge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://careerbridge-api.onrender.com/api
